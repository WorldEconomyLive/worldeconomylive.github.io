name: Daily update

on:
  schedule:
    - cron: "17 7 * * *"   # every day 07:17 UTC
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: worldeconomylive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull data and score
        run: python pipeline/run.py
      - name: Save data to repo
        run: |
          git config user.name "worldeconomylive-bot"
          git config user.email "worldeconomylive-bot@users.noreply.github.com"
          git add site/data data
          git commit -m "data: update $(date -u +%F)" || echo "no changes"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
